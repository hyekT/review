<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*,*::before,*::after{box-sizing:border-box}body{margin:0}</style></head><body>
<title>지문 복습 도우미📝🤗</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 상단 바 아래에 지문 목록(왼쪽)과 지문 상세·게임 3종(오른쪽). 게임 화면은 한 칸짜리 무대. 파란 잉크 / 빨간 펜 / 형광펜 세 가지 색으로 시험지 느낌을 낸다. */
:root{
 --font:'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
 --display:var(--font);--body:var(--font);--mono:var(--font);
 --bg:#EDF0F7;--surface:#FFFFFF;--surface2:#E3E8F4;--fg:#141B34;--muted:#56607E;--line:#C9D1E6;
 --ink:#2748D8;--ink-fg:#FFFFFF;--pen:#D32F4B;--pen-fg:#FFFFFF;--mark:#FFD84A;--mark-fg:#3A2F00;--ok:#1B8A57;--star:#D99A00;
 --stage:#101936;--stage-fg:#E8ECFA;--stage-line:#26315F;--chip:#E8ECFA;--chip-fg:#101936;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0C1124;--surface:#151C37;--surface2:#1E2749;--fg:#E7EBF8;--muted:#97A1C2;--line:#2B3560;
 --ink:#8199FF;--ink-fg:#0C1124;--pen:#FF6F8A;--pen-fg:#2A0610;--mark:#FFD84A;--mark-fg:#2B2300;--ok:#4CCB8C;--star:#FFD84A;
 --stage:#070B1A;--stage-fg:#E8ECFA;--stage-line:#222B52;--chip:#1E2749;--chip-fg:#E8ECFA;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0C1124;--surface:#151C37;--surface2:#1E2749;--fg:#E7EBF8;--muted:#97A1C2;--line:#2B3560;
 --ink:#8199FF;--ink-fg:#0C1124;--pen:#FF6F8A;--pen-fg:#2A0610;--mark:#FFD84A;--mark-fg:#2B2300;--ok:#4CCB8C;--star:#FFD84A;
 --stage:#070B1A;--stage-fg:#E8ECFA;--stage-line:#222B52;--chip:#1E2749;--chip-fg:#E8ECFA;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:17.5px/1.6 var(--body)}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:2px solid var(--fg);margin-bottom:20px}
.brand{font:700 28px/1 var(--display);letter-spacing:.01em}
.bwrap{display:flex;flex-direction:column;gap:4px;min-width:0}
.tag{font:500 14px/1.3 var(--body);color:var(--muted)}
@media(max-width:560px){.brand{font-size:24px}.tag{font-size:13px}}
.badge{font:500 14px var(--mono);padding:3px 10px;border:1.5px solid var(--ink);color:var(--ink);border-radius:999px}
.badge:empty{display:none}
.nav{margin-left:auto;display:flex;gap:4px}
.nav button{background:none;border:0;border-bottom:3px solid transparent;padding:6px 10px;font-weight:600}
.nav button[aria-current=page]{border-bottom-color:var(--ink);color:var(--ink)}
.lbl{font:500 13px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;min-width:0}
.home-grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.pitem[aria-current=true]{border-color:var(--ink);background:var(--surface2)}
.pno{font:500 13px var(--mono);color:var(--muted)}
.ptitle{font-weight:600}
.pprog{font:400 13px var(--mono);color:var(--star)}
.dtitle{font:700 32.5px/1.15 var(--display);margin-bottom:4px}
.dmeta{color:var(--muted);font-size:15px;margin-bottom:16px}
details.read{border:1px solid var(--line);border-radius:8px;margin-bottom:18px}
details.read summary{padding:10px 14px;cursor:pointer;font-weight:600}
.read-body{padding:4px 14px 14px;display:grid;gap:14px}
.ptext{max-width:65ch;line-height:1.9;font-size:18.5px}
mark{background:var(--mark);color:var(--mark-fg);padding:0 3px;border-radius:3px}
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 16px;margin:0;font-size:15px}
.vlist div{display:flex;gap:8px;min-width:0}
.vlist dt{font-family:var(--mono);font-weight:500}
.vlist dd{margin:0;color:var(--muted)}
.btn{background:var(--ink);color:var(--ink-fg);border:2px solid var(--ink);border-radius:8px;padding:10px 20px;font-weight:600}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.sm{padding:6px 12px;font-size:15px}
.btn.big{font-size:19.5px;padding:14px 24px;width:100%}
.btn:disabled{opacity:.45;cursor:default}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.extra-lbl{margin:22px 0 0}
.tile{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px}
.tile:hover{border-color:var(--ink)}
.tno{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--ink-fg);font:500 15px/30px var(--mono);text-align:center}
.tname{font:700 22.5px/1.2 var(--display)}
.tsub{font:500 12px var(--mono);letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.tdesc{font-size:15px;color:var(--muted)}
.tstat{margin-top:auto;padding-top:6px;display:flex;justify-content:space-between;align-items:center;font:400 14px var(--mono)}
.tstars{color:var(--star);letter-spacing:2px;font-size:17.5px}
.tstars .off,.bigstars .off{color:var(--line)}
.today{color:var(--ok);font-weight:500}
.gbar{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.gname{font:700 28px/1.1 var(--display)}
.gsub{color:var(--muted);font-size:15px}
.stagebox{padding:16px}
.setup{display:grid;gap:16px;max-width:560px;margin:8px auto;text-align:center}
.setup h2{font:700 24px var(--display)}
.opts{display:grid;gap:10px}
.opt-card{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px}
.opt-card span{color:var(--muted);font-size:15px}
.opt-card[aria-pressed=true]{border-color:var(--ink);background:var(--surface2)}
.hud{display:flex;justify-content:space-between;align-items:center;font:500 15px var(--mono);margin-bottom:8px;gap:8px}
.hearts{color:var(--pen);font-size:21.5px;letter-spacing:3px}
.field{position:relative;height:clamp(300px,52vh,460px);overflow:hidden;background:var(--stage);border:1px solid var(--stage-line);border-radius:8px;background-image:repeating-linear-gradient(to bottom,transparent 0 39px,var(--stage-line) 39px 40px);transition:box-shadow .2s}
.field.hurt{box-shadow:inset 0 0 0 4px var(--pen)}
.base{position:absolute;left:0;right:0;bottom:0;height:40px;border-top:2px solid var(--ink);background:var(--stage);color:var(--stage-fg);display:flex;align-items:center;justify-content:center;font:500 13px var(--mono);letter-spacing:.04em}
[hidden]{display:none!important}
.cmgrid{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:10px;margin:6px 0 10px;perspective:900px}
.cmcard{position:relative;min-height:clamp(70px,13vh,96px);border:0;padding:0;background:none;border-radius:10px;transform-style:preserve-3d;transition:transform .35s}
.cmcard.up,.cmcard.done{transform:rotateY(180deg)}
.cmface{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 8px;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;line-height:1.25;overflow:hidden}
.cmback{background:var(--ink);color:var(--ink-fg);font:700 28px var(--display);border:2px solid var(--ink)}
.cmfront{transform:rotateY(180deg);background:var(--surface);border:2px solid var(--line);font:700 clamp(16px,2.2vw,21.5px) var(--display)}
.cmfront small{font:500 12px var(--mono);color:var(--muted)}
.cmcard.en .cmfront{border-color:var(--ink)}
.cmcard.ko .cmfront{background:var(--surface2)}
.cmcard.done .cmfront{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok) inset}
.cmcard.bad .cmfront{border-color:var(--pen);box-shadow:0 0 0 2px var(--pen) inset}
.cmcard:not(.up):not(.done):hover .cmback{filter:brightness(1.12)}
.cmcard:disabled{cursor:default}
@media (prefers-reduced-motion:reduce){.cmcard{transition-duration:.01ms}}
.banner{position:absolute;inset:0;display:grid;place-items:center;font:700 clamp(32.5px,7vw,65px) var(--display);color:var(--mark);background:rgba(7,11,26,.72);z-index:3}
.wnode{position:absolute;top:0;will-change:transform}
.wchip{display:inline-block;max-width:min(260px,38vw);padding:6px 12px;border-radius:6px;background:var(--chip);color:var(--chip-fg);font-weight:600;line-height:1.35}
.wchip.en{font:500 18.5px var(--mono)}
.wchip.danger{background:var(--pen);color:var(--pen-fg)}
.wchip.pop{animation:pop .35s ease-out forwards}
@keyframes pop{0%{transform:scale(1);background:var(--mark);color:var(--mark-fg)}100%{transform:scale(1.6);opacity:0;background:var(--mark);color:var(--mark-fg)}}
.ctx{min-height:4.4em;margin:10px 0;padding:10px 14px;border:1px dashed var(--line);border-radius:8px;font-size:16px;display:flex;flex-direction:column;gap:2px}
.ctx b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.ctx-empty{color:var(--muted)}
.shoot{display:flex;gap:8px}
.ans,.typein{flex:1;min-width:0;font:500 19.5px var(--body);padding:12px 14px;border:2px solid var(--ink);border-radius:8px;background:var(--surface);color:var(--fg)}
.shake{animation:shake .3s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.doors{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.door{width:28px;height:8px;border-radius:4px;background:var(--line);transition:background .3s}
.door.cur{box-shadow:0 0 0 2px var(--ink)}
.door.done{background:var(--ink);border-color:var(--ink)}
.door.miss{background:var(--pen);border-color:var(--pen)}
.room{display:grid;gap:16px}
.roomno{font:500 13px var(--mono);letter-spacing:.12em;color:var(--muted)}
.sentence{font-size:clamp(21.5px,2.5vw,28px);line-height:2;max-width:65ch}
.slot{display:inline-block;border-bottom:3px solid var(--ink);text-align:center;font-family:var(--mono);font-weight:500;margin:0 4px}
.slot.filled,.slot.revealed{border-color:transparent;padding:0 8px;border-radius:4px}
.slot.filled{background:var(--mark);color:var(--mark-fg)}
.slot.revealed{background:var(--pen);color:var(--pen-fg)}
.fb{min-height:1.6em;font-weight:600}
.fb.good{color:var(--ok)}
.fb.bad{color:var(--pen)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choice{background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:14px;font:500 19.5px var(--mono);text-align:left}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice.wrong{opacity:.4;text-decoration:line-through;border-color:var(--pen)}
.typerow{display:flex;gap:8px;max-width:520px}
.tools{display:flex;gap:8px}
.mminfo{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:760px;margin:0 auto 8px;font:500 15px var(--mono)}
.timer{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;max-width:760px;margin:0 auto 12px}
.timer i{display:block;height:100%;background:var(--ink)}
@keyframes drain{from{width:100%}to{width:0}}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 20px;font-size:19.5px;line-height:2.2;max-width:760px;margin:0 auto;overflow:hidden;background-image:linear-gradient(to bottom,transparent calc(2.2em - 1px),var(--line) 0);background-size:100% 2.2em}
.blank{font:500 1em var(--mono);height:1.7em;vertical-align:top;margin-block:.25em;border:0;border-bottom:2px solid var(--ink);background:transparent;color:var(--fg);padding:0 2px;text-align:center;border-radius:0}
.blank.ok{border-color:var(--ok);color:var(--ok)}
.blank.bad{border-color:var(--pen);color:var(--pen);text-decoration:line-through}
.fix{font:500 15px var(--mono);color:var(--ok);margin-left:4px;background:var(--surface2);padding:0 6px;border-radius:4px}
.result{display:grid;gap:12px;max-width:640px;margin:12px auto;text-align:center}
.rtitle{font:700 34.5px var(--display)}
.bigstars{font-size:47.5px;letter-spacing:6px;color:var(--star)}
.rline{color:var(--muted)}
.rh{font:700 19.5px var(--display);text-align:left;margin-top:8px}
.missed{list-style:none;margin:0;padding:0;display:grid;gap:8px;text-align:left}
.missed li{padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.missed b{font-family:var(--mono);font-weight:500}
.mctx{font-size:15px;color:var(--muted);margin-top:2px}
.note{font-size:15px;color:var(--muted)}
.btnrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.rgrid{display:grid;gap:16px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface)}
.stat b{display:block;font:700 32.5px/1.1 var(--display)}
.stat span{font-size:14px;color:var(--muted)}
.week{display:flex;gap:8px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font:500 13px var(--mono);color:var(--muted)}
.wd i{width:28px;height:28px;border-radius:50%;border:2px solid var(--line)}
.wd.on i{background:var(--ink);border-color:var(--ink)}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
th{font:500 13px var(--mono);letter-spacing:.08em;color:var(--muted)}
td.s{color:var(--star);font-family:var(--mono);letter-spacing:1px}
.namef{width:100%;max-width:360px;padding:10px 12px;border:2px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:inherit}
.copyta{width:100%;min-height:90px;font:14px var(--mono);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px}
.tform{display:grid;gap:12px;max-width:760px}
.tform label{display:grid;gap:4px;font-weight:600;font-size:15px}
.tform input,.tform textarea{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:inherit;font-weight:400}
.tform textarea{min-height:120px;line-height:1.5;resize:vertical}
.tform .hint{font-weight:400;color:var(--muted);font-size:14px}
.tchk{font-size:15px;padding:8px 12px;border-radius:8px;border:1px solid var(--line)}
.tchk.warn{border-color:var(--pen);color:var(--pen)}
.tlist{display:grid;gap:8px;margin-top:18px;max-width:760px}
.trow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.trow b{flex:1;min-width:140px}
.tmsg{font-size:15px;color:var(--ok);min-height:1.4em}
/* Sentence Runner */
.sr{--sr-bg:#14112e;--sr-panel:#211c4a;--sr-panel2:#2d2763;--sr-ink:#fff8e8;--sr-mute:#b9b3e6;--sr-acc:#ffb020;--sr-good:#47d27a;--sr-line:#4a4290;border-radius:12px;overflow:hidden;background:var(--sr-bg);color:var(--sr-ink);border:2px solid var(--sr-line);-webkit-user-select:none;user-select:none;touch-action:manipulation}
.srhud{background:linear-gradient(#1b1640,#241e55);border-bottom:3px solid var(--sr-line);padding:8px 12px 10px}
.srrow{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.srbadge{background:var(--sr-panel2);border:2px solid var(--sr-line);border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700;white-space:nowrap}
.srlives{color:#ff6b7d;letter-spacing:2px;font-size:19.5px}
.srstat{font-size:15px;font-weight:700;white-space:nowrap}
.srstat b{font-size:19.5px;color:var(--sr-acc);font-variant-numeric:tabular-nums}
.srcombo{color:#7cf0ff;font-weight:700;font-size:15px}
.srsp{flex:1}
.srb{background:var(--sr-panel2);border:2px solid var(--sr-line);border-radius:10px;padding:5px 11px;font:700 14px inherit;color:var(--sr-ink);cursor:pointer}
.srb:hover{border-color:var(--sr-acc)}
.srb:disabled{opacity:.4;cursor:default}
.srko{font-size:clamp(17.5px,2.3vw,24px);font-weight:800;margin:8px 0 6px;line-height:1.4;min-height:1.4em}
.srslots{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;min-height:36px}
.srslot{display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 10px;border-radius:9px;border:2px dashed #6d64c4;color:#ffe9a8;font-weight:800;font-size:clamp(15px,1.8vw,19.5px)}
.srslot.cur{border-color:var(--sr-acc);animation:srpulse 1s infinite}
.srslot.ok{border:2px solid var(--sr-good);background:rgba(71,210,122,.16);color:#d8ffe5}
@keyframes srpulse{50%{box-shadow:0 0 0 4px rgba(255,176,32,.28)}}
.srwrap{position:relative;height:clamp(300px,52vh,460px);background:#000}
.srcv{position:absolute;inset:0;width:100%;height:100%;display:block}
.srcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.srcenter .big{font-size:clamp(65px,12vw,129.5px);font-weight:900;color:#fff;text-shadow:0 5px 0 rgba(0,0,0,.4),0 0 30px rgba(255,176,32,.5)}
.srcenter .small{font-size:clamp(14px,1.8vw,19.5px);font-weight:700;margin-top:6px;background:rgba(0,0,0,.55);padding:6px 14px;border-radius:999px}
.srtoast{position:absolute;left:50%;top:12px;transform:translate(-50%,-20px);opacity:0;transition:.25s;pointer-events:none;background:rgba(16,51,29,.92);border:2px solid var(--sr-good);border-radius:14px;padding:8px 16px;text-align:center;max-width:92%}
.srtoast.show{opacity:1;transform:translate(-50%,0)}
.srtoast .en{font-size:clamp(16px,2vw,21.5px);font-weight:800}
.srtoast .pt{color:#ffe28a;font-weight:800;font-size:14px;margin-top:2px}
.srpause{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(9,8,28,.82);padding:12px;z-index:5}
.srpause[hidden]{display:none}
.sr:fullscreen,.sr.srfs{width:100vw;height:100vh;border-radius:0;border:0;display:flex;flex-direction:column;background:var(--sr-bg)}
.sr.srfs{position:fixed;inset:0;z-index:9999}
.sr:fullscreen .srwrap,.sr.srfs .srwrap{flex:1;height:auto;min-height:0}
.sr:fullscreen .srhud,.sr.srfs .srhud{flex:none}
.sr:fullscreen .srfoot,.sr.srfs .srfoot{flex:none}
.srpanel{background:var(--sr-panel);border:3px solid var(--sr-line);border-radius:18px;padding:16px 22px;max-width:520px;width:100%}
.srpanel h3{margin:0 0 10px;font-size:24px}
.srtg{display:flex;gap:8px;flex-wrap:wrap}
.srtg button{background:var(--sr-panel2);border:2px solid var(--sr-line);border-radius:999px;padding:5px 13px;font:700 14px inherit;color:var(--sr-ink);cursor:pointer}
.srtg button.on{border-color:var(--sr-good);background:rgba(71,210,122,.2)}
.srbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.srbig{background:var(--sr-acc);color:#2a1d00;border:0;border-radius:12px;padding:9px 18px;font:900 16px inherit;box-shadow:0 4px 0 #b57400;cursor:pointer}

const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const esc=f=>f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

const cleanText=p=>p.text.replace(/\s+/g,' ').trim();

const reFor=f=>new RegExp('(^|[^A-Za-z])('+esc(f)+')(?![A-Za-z])','i');
const ctxFor=(p,v)=>{const re=reFor(v.form);return sentencesOf(p).find(s=>re.test(s))||'';};
function hlText(parent,text,forms){
  if(!forms.length){parent.append(text);return;}
  const re=new RegExp('(^|[^A-Za-z])('+forms.map(esc).join('|')+')(?![A-Za-z])','gi');
  let last=0,m;
  while((m=re.exec(text))){
    const s=m.index+m[1].length;
    parent.append(text.slice(last,s));
    parent.append(el('mark','',m[2]));
    last=s+m[2].length;re.lastIndex=last;
  }
  parent.append(text.slice(last));
}

const wrongOf=(pid,en)=>(S.wrong[pid]&&S.wrong[pid][en])||0;
function bump(pid,en,d){
  S.wrong[pid]=S.wrong[pid]||{};
  const n=Math.max(0,(S.wrong[pid][en]||0)+d);
  if(n)S.wrong[pid][en]=n;else delete S.wrong[pid][en];
}
function weightedPick(items,pid,key,n){
  const pool=items.map(it=>({it:it,w:1+2*wrongOf(pid,key(it))}));
  const out=[];
  while(out.length<n&&pool.length){
    let r=Math.random()*pool.reduce((a,b)=>a+b.w,0),i=0;
    for(;i<pool.length;i++){r-=pool[i].w;if(r<=0)break;}
    i=Math.min(i,pool.length-1);
    out.push(pool.splice(i,1)[0].it);
  }
  return out;
}
function record(pid,game,stars,score){

  S.plays[k]=(S.plays[k]||0)+1;
  if(stars>(S.best[k]||0))S.best[k]=stars;
  S.log.push({t:t,pid:pid,game:game,stars:stars,score:score});
  S.log=S.log.slice(-60);
  save();renderBadge();
}

  const set=new Set(S.days),d=new Date();

}

/* ===== 추가: 카드 짝 맞추기 ===== */
function runCM(p,level){
  const root=$('#stage');root.textContent='';
  const vs=V(p);
  const want=[6,8,10][(level||1)-1]||6;
  const usedKo=new Set(),pool=[];
  shuffle(vs).forEach(v=>{const k=v.ko[0];if(!usedKo.has(k)){usedKo.add(k);pool.push(v);}});
  if(pool.length<4){root.append(el('p','note','이 지문은 어휘가 적어서 카드 게임을 하기 어려워요. 어휘를 4개 이상 넣어 주세요.'));return function(){};}
  const pairs=Math.min(want,pool.length);
  const picked=weightedPick(pool,p.id,v=>v.en,pairs);
  const cards=shuffle(picked.reduce((a,v)=>a.concat([{v:v,side:'en',t:v.en},{v:v,side:'ko',t:v.ko[0]}]),[]));
  const cols=cards.length<=12?4:cards.length<=16?4:5;
  root.insertAdjacentHTML('beforeend','<div class="hud"><span class="cmt">⏱ 0:00</span><span class="cmp"></span><span class="cmm"></span></div><div class="cmgrid" style="--cols:'+cols+'"></div><div class="ctx"><span class="ctx-empty">짝을 맞힌 단어가 쓰인 지문 속 문장이 여기에 나타나요.</span></div>');
  const tEl=$('.cmt',root),pEl=$('.cmp',root),mEl=$('.cmm',root),grid=$('.cmgrid',root),ctx=$('.ctx',root);
  let open=[],done=0,tries=0,miss=0,lock=false,running=true,t0=0,iv=0,to=0;
  const missed=new Map();
  const fmtT=s=>Math.floor(s/60)+':'+pad(s%60);
  function hud(){pEl.textContent='맞힌 쌍 '+done+' / '+pairs;mEl.textContent='시도 '+tries+'번';}
  const els=cards.map((c,i)=>{
    const b=el('button','cmcard '+c.side);b.type='button';
    b.setAttribute('aria-label','카드 '+(i+1)+' (뒤집기)');
    const back=el('span','cmface cmback','?'),front=el('span','cmface cmfront');
    front.append(el('small','',c.side==='en'?'ENGLISH':'뜻'),el('span','',c.t));
    b.append(back,front);
    b.onclick=()=>flip(i);
    grid.append(b);return b;
  });
  function flip(i){
    if(!running||lock)return;
    const b=els[i];
    if(b.classList.contains('up')||b.classList.contains('done'))return;
    if(!t0){t0=Date.now();iv=setInterval(()=>{tEl.textContent='⏱ '+fmtT(Math.floor((Date.now()-t0)/1000));},500);}
    b.classList.add('up');b.setAttribute('aria-label','카드: '+cards[i].t);
    open.push(i);
    if(open.length<2)return;
    tries++;lock=true;
    const a=cards[open[0]],c=cards[open[1]];
    if(a.v===c.v&&a.side!==c.side){
      const idx=open.slice();open=[];
      to=setTimeout(()=>{
        idx.forEach(k=>{els[k].classList.remove('up');els[k].classList.add('done');els[k].disabled=true;});
        done++;lock=false;hud();
        const s=ctxFor(p,a.v);ctx.textContent='';
        const line=el('div');line.append(el('b','',a.v.en+' = '+a.v.ko.join(', ')));ctx.append(line);
        if(s){const q=el('div');hlText(q,s,[a.v.form]);ctx.append(q);}
        if(done>=pairs)finish();
      },450);
    }else{
      miss++;
      [a.v,c.v].forEach(v=>{missed.set(v.en,v);bump(p.id,v.en,1);});
      const idx=open.slice();open=[];
      idx.forEach(k=>els[k].classList.add('bad'));hud();
      to=setTimeout(()=>{idx.forEach(k=>{els[k].classList.remove('up','bad');els[k].setAttribute('aria-label','카드 '+(k+1)+' (뒤집기)');});lock=false;},950);
    }
    hud();
  }
  function finish(){
    if(!running)return;running=false;clearInterval(iv);
    const sec=Math.max(1,Math.round((Date.now()-t0)/1000));
    const stars=miss<=Math.ceil(pairs/3)?3:(miss<=pairs?2:1);
    record(p.id,'cm',stars,sec+'초 · 틀린 시도 '+miss);
    done&&picked.forEach(v=>{if(!missed.has(v.en))bump(p.id,v.en,-1);});
    setTimeout(()=>{
      root.textContent='';
      root.append(resultCard({title:stars===3?'완벽해요!':stars===2?'잘했어요!':'끝까지 해냈어요!',stars:stars,
        lines:['걸린 시간 '+fmtT(sec),'시도 '+tries+'번 · 틀린 시도 '+miss+'번'],
        missed:Array.from(missed.values()),p:p,again:()=>{stopAll();cur.stop=runCM(p,level);},

/* ===== 답 비교 ===== */
const nk=s=>s.toLowerCase().replace(/\([^)]*\)/g,'').replace(/[\s~.,!?'"·\/\-]/g,'');
const ne=s=>s.toLowerCase().trim().replace(/\s+/g,' ');
function koSet(v){
  const out=new Set();
  v.ko.forEach(k=>{
    out.add(nk(k));
    if(k.trim().charAt(0)==='~')out.add(nk(k.replace(/^\s*~\s*[을를이가에은는와과]?\s*/,'')));
  });
  return out;
}
function matches(v,raw,mode){
  if(mode==='en2ko'){const n=nk(raw);return !!n&&koSet(v).has(n);}
  const r=ne(raw);
  return !!r&&(r===ne(v.en)||r===ne(v.form));
}

/* ===== 1. 어휘 학습 ===== */
function runTD(p,mode){
  const root=$('#stage');root.textContent='';
  const vs=V(p);
  const waves=[{n:Math.min(vs.length,8),fall:15,gap:3.4},{n:Math.min(vs.length,10),fall:12,gap:2.8},{n:Math.min(vs.length,10),fall:10,gap:2.3}];
  const total=waves.reduce((a,w)=>a+w.n,0);
  root.insertAdjacentHTML('beforeend','<div class="hud"><span class="hearts" aria-label="남은 기회"></span><span class="wv"></span><span class="sc"></span></div><div class="field"><div class="banner" hidden></div><div class="base">이 선에 닿으면 놓친 단어예요</div></div><div class="ctx"><span class="ctx-empty">맞힌 단어가 쓰인 지문 속 문장이 여기에 나타나요.</span></div><div class="shoot"><input class="ans" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><button class="btn" type="button">확인</button></div>');
  const hEl=$('.hearts',root),wvEl=$('.wv',root),scEl=$('.sc',root),field=$('.field',root),bn=$('.banner',root),base=$('.base',root),ctx=$('.ctx',root),ans=$('.ans',root),go=$('.shoot .btn',root);
  ans.placeholder=mode==='en2ko'?'뜻을 입력하고 Enter':'영어 철자를 입력하고 Enter';
  ans.setAttribute('aria-label','정답 입력');
  let lives=3,wi=-1,queue=[],active=[],hit=0,since=0,last=0,raf=0,running=true,banner=0,lastX=-99;
  const missed=[];
  function hearts(){const l=Math.max(0,lives);hEl.textContent='♥'.repeat(l)+'♡'.repeat(3-l);}
  function updateHud(){wvEl.textContent=Math.min(wi+1,waves.length)+' / '+waves.length+' 라운드';scEl.textContent='맞힌 단어 '+hit+' / '+total;}
  function showBanner(t){banner=performance.now()+1500;bn.textContent=t;bn.hidden=false;}
  function startWave(){
    wi++;
    if(wi>=waves.length)return finish(true);
    queue=shuffle(weightedPick(vs,p.id,v=>v.en,waves[wi].n));
    since=waves[wi].gap;
    showBanner((wi+1)+'라운드');
    updateHud();
  }
  function spawn(){
    const v=queue.shift();
    let x;do{x=3+Math.random()*57;}while(Math.abs(x-lastX)<20);
    lastX=x;
    const node=el('div','wnode'),chip=el('span','wchip'+(mode==='en2ko'?' en':''),mode==='en2ko'?v.en:v.ko[0]);
    node.style.left=x+'%';node.append(chip);field.append(node);
    active.push({v:v,node:node,chip:chip,y:0});
  }
  function removeWord(a){const i=active.indexOf(a);if(i>=0)active.splice(i,1);}
  function miss(a){
    removeWord(a);a.node.remove();
    lives--;hearts();bump(p.id,a.v.en,1);missed.push(a.v);
    field.classList.add('hurt');setTimeout(()=>field.classList.remove('hurt'),300);
    if(lives<=0)finish(false);
  }
  function showCtx(v){
    ctx.textContent='';
    ctx.append(el('b','',v.en+' = '+v.ko[0]));
    const s=ctxFor(p,v);
    if(s){const sp=el('span');hlText(sp,s,[v.form]);ctx.append(sp);}
  }
  function fire(raw){
    const cand=active.filter(a=>matches(a.v,raw,mode));
    if(!cand.length)return false;
    const a=cand.reduce((m,x)=>x.y>m.y?x:m);
    hit++;bump(p.id,a.v.en,-1);
    a.chip.classList.add('pop');
    removeWord(a);
    const node=a.node;setTimeout(()=>node.remove(),400);
    showCtx(a.v);updateHud();
    return true;
  }
  function tick(ts){
    if(!running)return;
    if(!last)last=ts;
    const dt=Math.min(0.1,(ts-last)/1000);last=ts;
    if(banner){
      if(ts<banner){raf=requestAnimationFrame(tick);return;}
      banner=0;bn.hidden=true;
    }
    const w=waves[wi],H=Math.max(120,field.clientHeight-base.offsetHeight);
    since+=dt;
    if(queue.length&&since>=w.gap){spawn();since=0;}
    active.slice().forEach(a=>{
      if(!running)return;
      a.y+=dt*H/w.fall;
      a.node.style.transform='translateY('+a.y+'px)';
      a.chip.classList.toggle('danger',a.y>H*0.65);
      if(a.y+a.node.offsetHeight>=H)miss(a);

    if(running)raf=requestAnimationFrame(tick);
  }
  function finish(win){
    if(!running)return;
    running=false;cancelAnimationFrame(raf);
    const stars=win?lives:(hit/total>=0.5?1:0);
    record(p.id,'td',stars,hit+'/'+total);
    const uniq=Array.from(new Map(missed.map(v=>[v.en,v])).values());
    root.textContent='';
    root.append(resultCard({title:win?'완료!':'아쉬워요',stars:stars,lines:['맞힌 단어 '+hit+' / '+total,'남은 기회 '+Math.max(0,lives)],missed:uniq,p:p,again:()=>{stopAll();cur.stop=runTD(p,mode);}}));
  }
  function clearInput(){ans.blur();ans.value='';ans.focus();}
  function submit(){
    if(!running||banner)return;
    const raw=ans.value;
    if(!raw.trim())return;
    if(fire(raw))clearInput();else shake(ans);
  }
  ans.addEventListener('input',e=>{if(mode==='ko2en'&&!e.isComposing&&running&&!banner&&fire(ans.value))ans.value='';});
  ans.addEventListener('keyup',e=>{if(e.key==='Enter')submit();});
  go.onclick=submit;
  hearts();startWave();
  raf=requestAnimationFrame(tick);
  ans.focus();
  return function(){running=false;cancelAnimationFrame(raf);};
}

const NOEND=new Set(['a','an','the','to','of','in','on','at','by','for','with','from','into','and','but','or','that','who','which','is','are','was','were','be','been','will','would','can','could','may','might','should','must','not','our','their','his','her','my','your','its','this','these','those','each','every','too','very','more','most','as','than','if','because','when','while','whose','whom','so','such','both','all','any','some','no','than','am','do','does','did','have','has','had','what','how','why','where','whether']);

  function makeChoices(s,i){

    const req=srEl.requestFullscreen||srEl.webkitRequestFullscreen;
    if(req){
      let r;try{r=req.call(srEl);}catch(e){r=null;}
      if(r&&r.catch)r.catch(()=>{srEl.classList.add('srfs');syncFull();});
      else if(!r&&!document.fullscreenElement&&!document.webkitFullscreenElement)setTimeout(()=>{if(!isFull()){srEl.classList.add('srfs');syncFull();}},150);
    }else{srEl.classList.add('srfs');syncFull();}
  }
  document.addEventListener('fullscreenchange',syncFull);
  document.addEventListener('webkitfullscreenchange',syncFull);
  const ro=window.ResizeObserver?new ResizeObserver(()=>resize()):null;
  if(ro)ro.observe(wrap);
  function togglePause(){
    if(state==='play'){state='pause';renderToggles();q('.srpause').hidden=false;}
    else if(state==='pause'){state='play';q('.srpause').hidden=true;}
  }
  const kd=e=>{
    if(!running)return;
    if(e.code==='Space'||e.code==='ArrowUp'||e.code==='ArrowDown')e.preventDefault();
    if(e.repeat)return;
    ensureAudio();
    if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')jump();
    else if(e.code==='KeyH')useHint();
    else if(e.code==='KeyP'||e.code==='Escape'){if(e.code==='Escape'&&srEl.classList.contains('srfs')){toggleFull();return;}togglePause();}
    else if(e.code==='KeyF')toggleFull();
  };
  const onBlur=()=>{if(state==='play')togglePause();};
  const onVis=()=>{if(document.hidden&&state==='play')togglePause();};
  document.addEventListener('keydown',kd);
  window.addEventListener('blur',onBlur);
  document.addEventListener('visibilitychange',onVis);
  window.addEventListener('resize',resize);
  wrap.addEventListener('pointerdown',e=>{if(e.target.closest('.srpause'))return;ensureAudio();jump();});
  root.addEventListener('click',e=>{
    const t=e.target.closest('[data-t]');
    if(t){ensureAudio();const k=t.dataset.t;S.pref[k]=k==='srSfx'?!sfxOn():!S.pref[k];save();renderToggles();updateHud();return;}
    const a=e.target.closest('[data-a]');
    if(!a)return;
    const act=a.dataset.a;
    a.blur();
    if(act==='hint')useHint();
    else if(act==='pause'||act==='resume')togglePause();
    else if(act==='full')toggleFull();
    else if(act==='sound'){ensureAudio();S.pref.srSfx=!sfxOn();save();renderToggles();updateHud();}
    else if(act==='restart'){stopAll();cur.stop=runSR(p,diff);}
    else if(act==='quit'){startGame(cur.pid,'sr',false);}
  });

  /* ---- update ---- */
  function update(dt){
    const g=G;g.t+=dt;
    g.speed=D.speed*(1+0.02*g.sentIdx);
    const mv=g.speed*dt;g.dist+=mv;
    g.objs.forEach(o=>{o.x-=mv;});
    if(g.phase==='countdown'){
      g.cd-=dt;
      const n=Math.ceil(g.cd-0.4);
      if(n!==g.cdLast){
        g.cdLast=n;
        q('.srcenter').innerHTML=n>0?'<div class="big">'+n+'</div><div class="small">Space 또는 ↑ 로 점프! 공중에서 한 번 더 누르면 더 높이 올라가요</div>':'<div class="big">GO!</div>';
        if(n>0)sfx.tick();
      }
      if(g.cd<=0){g.phase='run';q('.srcenter').innerHTML='';beginSentence(true);}
    }else if(g.phase==='between'){
      g.wait-=dt;if(g.wait<=0)nextSentence();
      if(state!=='play')return;
    }
    if(g.h>0||g.vy>0){
      g.h+=g.vy*dt;g.vy-=GRAV*dt;
      if(g.h<=0){g.h=0;g.vy=0;g.jumps=0;}
    }
    if(g.invuln>0)g.invuln-=dt;
    if(g.shake>0)g.shake-=dt;
    const pl=PX-14,pr=PX+14,pb=g.h,pt=g.h+50;
    for(const o of g.objs.slice()){
      if(o.type==='gate'){
        if(o.done){o.pickT+=dt;continue;}
        if(g.phase==='run'||g.phase==='between'){
          if(o.x<pr&&o.x+o.w>pl){
            for(const b of o.blocks){
              const bb=SLOT_H[b.slot],bt=bb+BH;
              if(pt>bb&&pb<bt){
                o.done=true;o.pick=b;
                if(b.correct)onCorrect();else onWrong();
                break;
              }
            }
            if(state!=='play')return;
          }else if(o.x+o.w<pl){
            o.done=true;o.pick=null;o.pickT=1;
            if(g.phase==='run')onMiss();
          }
        }
      }else if(o.type==='heart'){
        if(!o.done&&o.x<pr&&o.x+o.w>pl&&pb<o.y+30&&pt>o.y){
          o.done=true;
          if(g.lives<g.maxLives){g.lives++;addFloat(PX+20,view.ground-g.h-80,'♥ +1','#ff8fa0');}
          else{g.score+=20;addFloat(PX+20,view.ground-g.h-80,'+20','#ffe066');}
          burst(o.x+15,view.ground-o.y-15,'#ff6b7d',14);sfx.good();updateHud();
        }
      }else if(o.type==='spike'){
        if(g.invuln<=0&&o.x+4<pr-2&&o.x+o.w-4>pl+2&&pb<28){onHit();if(state!=='play')return;}
      }
    }
    g.objs=g.objs.filter(o=>o.x+(o.w||0)>-400&&!(o.type==='gate'&&o.done&&o.pickT>1)&&!(o.type==='heart'&&o.done));
    g.parts.forEach(pp=>{pp.t+=dt;pp.x+=pp.vx*dt;pp.y+=pp.vy*dt;pp.vy+=700*dt;});
    g.parts=g.parts.filter(pp=>pp.t<pp.life);
    g.floats.forEach(f=>{f.t+=dt;f.y-=34*dt;});
    g.floats=g.floats.filter(f=>f.t<1.3);
  }

  /* ---- draw ---- */
  function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
  function draw(dist,g,t){
    const k=view.dpr*view.scale;
    ctx.setTransform(k,0,0,k,0,0);
    if(g.shake>0)ctx.translate(rand(-5,5)*g.shake*3,rand(-4,4)*g.shake*3);
    if(!bg)buildBackground();
    const gy=view.ground;
    ctx.drawImage(bg.sky,0,0,view.W,view.H);
    ctx.fillStyle=T.cloud;
    bg.clouds.forEach(c=>{
      const m=view.W+200,x=((c.x-dist*c.v)%m+m)%m-100;
      [[x,c.y,38,16],[x+24*c.s,c.y-9*c.s,26,15],[x-22*c.s,c.y-5*c.s,22,12]].forEach(e=>{ctx.beginPath();ctx.ellipse(e[0],e[1],e[2]*c.s,e[3]*c.s,0,0,7);ctx.fill();});
    });
    [[bg.far,.12],[bg.near,.3]].forEach(a=>{
      const x0=-((dist*a[1])%STRIP);
      for(let x=x0;x<view.W;x+=STRIP)ctx.drawImage(a[0],x,0,STRIP,view.H);
    });
    ctx.fillStyle=T.ground;ctx.fillRect(0,gy,view.W,view.H-gy);
    ctx.fillStyle=T.top;ctx.fillRect(0,gy,view.W,9);
    ctx.fillStyle='rgba(0,0,0,.18)';
    const off=dist%90;
    for(let x=-off;x<view.W;x+=90)ctx.fillRect(x,gy+28,46,6);
    for(let x=-off+45;x<view.W;x+=90)ctx.fillRect(x,gy+50,30,5);
    for(const o of g.objs){if(o.type==='spike')drawSpike(o);else if(o.type==='heart')drawHeart(o,t);else drawGate(o,t);}
    drawPlayer(g,t);
    g.parts.forEach(pp=>{ctx.globalAlpha=Math.max(0,1-pp.t/pp.life);ctx.fillStyle=pp.c;ctx.fillRect(pp.x,pp.y,pp.s,pp.s);});
    ctx.globalAlpha=1;
    ctx.font='900 22px '+FONT;ctx.textAlign='center';
    g.floats.forEach(f=>{ctx.globalAlpha=Math.max(0,1-f.t/1.3);ctx.lineWidth=5;ctx.strokeStyle='rgba(0,0,0,.65)';ctx.strokeText(f.text,f.x,f.y);ctx.fillStyle=f.color;ctx.fillText(f.text,f.x,f.y);});
    ctx.globalAlpha=1;
  }
  function drawHeart(o,t){
    const cx=o.x+15,cy=view.ground-o.y-15+Math.sin(t*5+o.x*.02)*4,s=1+Math.sin(t*8)*.06;
    ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);
    ctx.fillStyle='rgba(255,107,125,.28)';ctx.beginPath();ctx.arc(0,0,22,0,7);ctx.fill();
    ctx.beginPath();ctx.moveTo(0,12);ctx.bezierCurveTo(-20,-2,-12,-18,0,-8);ctx.bezierCurveTo(12,-18,20,-2,0,12);ctx.closePath();
    ctx.fillStyle='#ff4d6a';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.ellipse(-6,-6,3.4,2,-.6,0,7);ctx.fill();
    ctx.restore();
  }
  function drawSpike(o){
    const gy=view.ground;
    for(let i=0;i<o.k;i++){
      const x=o.x+i*34;
      ctx.fillStyle='#d9dbe8';ctx.beginPath();ctx.moveTo(x,gy);ctx.lineTo(x+17,gy-36);ctx.lineTo(x+34,gy);ctx.closePath();ctx.fill();
      ctx.strokeStyle='#ff5d6c';ctx.lineWidth=3;ctx.stroke();
    }
  }
  function drawGate(o,t){
    const gy=view.ground;
    let alpha=1;
    if(o.done)alpha=Math.max(0,1-o.pickT/.7);
    if(alpha<=0)return;
    ctx.globalAlpha=alpha;
    ctx.fillStyle='rgba(255,255,255,.10)';rr(o.x-8,gy-300,o.w+16,300,14);ctx.fill();
    ctx.setLineDash([7,7]);ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;ctx.stroke();ctx.setLineDash([]);
    for(const b of o.blocks){
      const y=gy-SLOT_H[b.slot]-BH;
      let fill='#fffdf3',stroke='#3b2f63',txt='#2a2350',dy=0,a=alpha;
      if(o.done){
        if(o.pick===b){fill=b.correct?'#b9f5c6':'#ffc4c9';stroke=b.correct?'#1f9d4c':'#d33a4a';dy=-Math.min(40,o.pickT*90);a=Math.max(0,1-o.pickT/.8);}
        else a=alpha*.35;
      }
      ctx.globalAlpha=a;
      if(o.hint&&!o.done&&b.correct){
        const pp=.5+.5*Math.sin(t*9);
        ctx.globalAlpha=a*(.45+.45*pp);ctx.fillStyle='#ffe24a';rr(o.x-7,y-7,o.w+14,BH+14,16);ctx.fill();ctx.globalAlpha=a;
      }
      rr(o.x,y+dy,o.w,BH,11);ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=stroke;ctx.stroke();
      ctx.font='800 '+o.fs+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle=txt;ctx.fillText(b.text,o.x+o.w/2,y+dy+BH/2+1);
      ctx.textBaseline='alphabetic';
    }
    ctx.globalAlpha=1;
  }
  function drawPlayer(g,t){
    if(g.invuln>0&&Math.floor(g.invuln*14)%2)return;
    drawBoy(g,t);
  }
  function drawBoy(g,t){
    const fy=view.ground-g.h,air=g.h>0,ph=t*14;
    ctx.save();ctx.translate(PX,fy);
    ctx.lineCap='round';ctx.lineJoin='round';
    if(air){ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,g.h,Math.max(8,16-g.h/14),4,0,0,7);ctx.fill();}
    const sw=air?0:Math.sin(ph),bob=air?0:Math.abs(Math.cos(ph))*2;
    const leg=(hx,fx,fyy,col)=>{
      const hy=-24,dx=fx-hx,dy=fyy-hy,d=Math.min(Math.hypot(dx,dy),22),L=11.5;
      const hh=Math.sqrt(Math.max(0,L*L-(d/2)*(d/2)));
      const nx=dy/(d||1),ny=-dx/(d||1);            // 진행 방향(앞)으로 무릎이 꺾이도록
      const sgn=nx>=0?1:-1;
      const kx=(hx+fx)/2+nx*sgn*hh,ky=(hy+fyy)/2+ny*sgn*hh;
      ctx.strokeStyle=col;ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(kx,ky);ctx.lineTo(fx,fyy);ctx.stroke();
      // 신발: 테두리 없이 다른 부위처럼 면으로만(갈색 구두)
      ctx.fillStyle='#4a3428';ctx.beginPath();ctx.ellipse(fx+3,fyy+1,7.5,4,0,0,7);ctx.fill();
      ctx.fillStyle='#2e2019';ctx.fillRect(fx-4,fyy+3,14,1.8);
    };
    const stride=(hx,off,col)=>{
      const th=Math.sin(ph+off)*0.5,R=21.5;            // 원 궤도 대신 앞뒤로만 흔들기(진자)
      const fx=hx+Math.sin(th)*R,fyy=-24+Math.cos(th)*R;
      leg(hx,fx,fyy,col);
    };
    if(air){leg(-3,-10,-9,'#1e2347');leg(5,13,-14,'#232a55');}
    else{stride(-3,0,'#1e2347');stride(5,Math.PI,'#232a55');}
    ctx.save();ctx.translate(0,-bob);
    const arm=(ang,col)=>{
      const sx=0,sy=-38,ex=sx+ang*7+2,ey=sy+8,hx2=ex+ang*4+2,hy=ey+(air?-3:4);
      ctx.strokeStyle=col;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();
      ctx.strokeStyle='#ffd2a6';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(hx2,hy);ctx.stroke();
    };
    arm(air?-1:sw,'#dfe6f5');
    // 가방
    ctx.fillStyle='#e0683c';rr(-17,-42,11,20,4);ctx.fill();
    ctx.fillStyle='#b9502b';ctx.fillRect(-15,-34,7,3);
    // 몸(와이셔츠 + 조끼)
    ctx.fillStyle='#f6f8ff';rr(-9,-44,19,24,6);ctx.fill();
    ctx.fillStyle='#2b3a7a';rr(-9,-40,19,18,5);ctx.fill();
    ctx.fillStyle='#f6f8ff';ctx.beginPath();ctx.moveTo(1,-44);ctx.lineTo(5,-40);ctx.lineTo(8,-44);ctx.closePath();ctx.fill();
    ctx.fillStyle='#c93a4a';ctx.fillRect(5,-41,2.5,7);
    // 목
    ctx.fillStyle='#ffd2a6';ctx.fillRect(1,-48,6,6);
    // 머리
    ctx.fillStyle='#ffd2a6';ctx.beginPath();ctx.arc(4,-55,11,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(-6.5,-54,2.6,0,7);ctx.fill();
    // 머리카락(짧은 스포츠 머리)
    ctx.fillStyle='#1f1a1a';ctx.beginPath();ctx.arc(3,-57,11.5,Math.PI*1.02,Math.PI*2.02);ctx.lineTo(14,-58);ctx.quadraticCurveTo(8,-62,-7,-56);ctx.closePath();ctx.fill();
    ctx.fillRect(-8,-60,6,7);
    // 얼굴
    ctx.fillStyle='#1f1a1a';ctx.beginPath();ctx.arc(9,-55,1.8,0,7);ctx.fill();
    ctx.strokeStyle='#1f1a1a';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(6.5,-58.5);ctx.lineTo(11.5,-58);ctx.stroke();
    ctx.strokeStyle='#b4543f';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(10,-51,2.6,.15*Math.PI,.8*Math.PI);ctx.stroke();
    ctx.fillStyle='rgba(255,120,120,.35)';ctx.beginPath();ctx.arc(8,-51.5,2.4,0,7);ctx.fill();
    // 앞쪽 팔
    arm(air?1:-sw,'#f6f8ff');
    ctx.restore();
    ctx.restore();
  }

  function frame(ts){
    if(!running)return;
    raf=requestAnimationFrame(frame);
    const dt=Math.min(.033,(ts-lastTs)/1000||0);lastTs=ts;
    if(state==='play'){update(dt);animT+=dt;}
    if(running&&G)draw(G.dist,G,animT);
  }
  function cleanup(){
    running=false;cancelAnimationFrame(raf);clearInterval(bgmIv);
    document.removeEventListener('keydown',kd);
    document.removeEventListener('visibilitychange',onVis);
    window.removeEventListener('blur',onBlur);
    window.removeEventListener('resize',resize);
    document.removeEventListener('fullscreenchange',syncFull);document.removeEventListener('webkitfullscreenchange',syncFull);
    if(ro)ro.disconnect();
    try{if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);}catch(e){}
    try{if('speechSynthesis' in window)speechSynthesis.cancel();}catch(e){}
    if(ac){try{ac.close();}catch(e){}ac=null;}
  }
  G=newGame();
  window.__SR={get G(){return G;},get state(){return state;},jump:jump,PX:PX,SLOT_H:SLOT_H};
  ensureAudio();
  resize();renderToggles();updateHud();
  raf=requestAnimationFrame(frame);
  return cleanup;
}

/* ===== 4. 기억력 챌린지 ===== */
const STOP=new Set(['however','because','through','without','another','between','something','nothing','everything','different','together','during','before','should','could','would','their','there','these','those','which','where','while','often','within','almost','people','around','against']);
function runMM(p,level){
  const root=$('#stage');root.textContent='';
  const cfg={1:{sec:30,k:5},2:{sec:20,k:8},3:{sec:15,k:12}}[level]||{sec:30,k:5};
  const vs=V(p),toks=cleanText(p).match(/[A-Za-z]+(?:['’\-][A-Za-z]+)*|[^A-Za-z]+/g)||[];
  const fmap=new Map();
  vs.forEach(v=>{if(!/\s/.test(v.form))fmap.set(v.form.toLowerCase(),v);});
  const widx=[];
  toks.forEach((t,i)=>{if(/^[A-Za-z]/.test(t))widx.push(i);});
  const seen=new Set(),vc=[];
  widx.forEach(i=>{const l=toks[i].toLowerCase();if(fmap.has(l)&&!seen.has(l)){seen.add(l);vc.push(i);}});
  let pick=weightedPick(vc,p.id,i=>fmap.get(toks[i].toLowerCase()).en,Math.min(cfg.k,vc.length));
  if(pick.length<cfg.k){
    const used=new Set(seen),extra=[];
    shuffle(widx).forEach(i=>{
      const l=toks[i].toLowerCase();
      if(extra.length+pick.length>=cfg.k)return;
      if(!fmap.has(l)&&!used.has(l)&&l.length>=6&&!STOP.has(l)){used.add(l);extra.push(i);}
    });
    pick=pick.concat(extra);
  }
  if(!pick.length){root.append(el('p','note','빈칸으로 만들 단어를 찾지 못했어요.'));return function(){};}
  pick.sort((a,b)=>a-b);
  const pset=new Set(pick),k=pick.length;
  const info=el('div','mminfo'),tw=el('div','timer'),bar=el('i');
  tw.append(bar);
  const paper=el('div','paper'),acts=el('div','btnrow');
  const lab=el('span','','외우기 · 빈칸 '+k+'개'),cd=el('span','',cfg.sec+'초');
  info.append(lab,cd);
  root.append(info,tw,paper,acts);
  paper.textContent=toks.join('');
  bar.style.animation='drain '+cfg.sec+'s linear forwards';
  let phase=1,left=cfg.sec,iv=0;
  const doneBtn=el('button','btn','다 외웠어요');doneBtn.type='button';
  acts.append(doneBtn);
  doneBtn.onclick=toRecall;
  iv=setInterval(()=>{left--;cd.textContent=Math.max(0,left)+'초';if(left<=0)toRecall();},1000);
  function toRecall(){
    if(phase!==1)return;
    phase=2;clearInterval(iv);
    tw.hidden=true;lab.textContent='복원하기 · 빈칸 '+k+'개를 채워요';cd.textContent='';
    paper.textContent='';
    const inputs=[];
    let done=false;
    toks.forEach((t,i)=>{
      if(!pset.has(i)){paper.append(t);return;}
      const inp=el('input','blank');inp.type='text';inp.autocomplete='off';
      inp.setAttribute('autocapitalize','off');inp.spellcheck=false;
      inp.style.width=(t.length+1.5)+'ch';inp.dataset.i=String(i);
      inp.setAttribute('aria-label','빈칸 '+(inputs.length+1));
      inp.addEventListener('keyup',e=>{
        if(e.key!=='Enter')return;
        const n=inputs[inputs.indexOf(inp)+1];
        if(n)n.focus();else check();
      });
      inputs.push(inp);paper.append(inp);
    });
    acts.textContent='';
    const ck=el('button','btn','확인');ck.type='button';ck.onclick=check;acts.append(ck);
    inputs[0].focus();
    function check(){
      if(done)return;
      done=true;
      let okc=0;
      const wrongList=[];
      inputs.forEach(inp=>{
        const ans=toks[+inp.dataset.i],good=inp.value.trim().toLowerCase()===ans.toLowerCase();
        inp.disabled=true;inp.classList.add(good?'ok':'bad');
        if(good)okc++;else inp.after(el('span','fix',ans));
        const v=fmap.get(ans.toLowerCase());
        if(v){bump(p.id,v.en,good?-1:1);if(!good)wrongList.push(v);}
      });
      acts.textContent='';
      const ratio=okc/k,stars=ratio>=0.9?3:ratio>=0.6?2:1;
      record(p.id,'mm',stars,okc+'/'+k+' L'+level);
      const extra=(level<3&&stars>=2)?{label:'다음 단계 도전',fn:()=>{S.pref.mm=level+1;save();stopAll();cur.stop=runMM(p,level+1);}}:null;
      root.append(resultCard({title:stars===3?'완벽해요!':stars===2?'잘했어요!':'조금만 더!',stars:stars,lines:['맞힌 빈칸 '+okc+' / '+k+' · '+level+'단계'],missed:wrongList,p:p,again:()=>{stopAll();cur.stop=runMM(p,level);},extra:extra}));
      root.lastChild.scrollIntoView({block:'nearest'});
    }
  }
  return function(){clearInterval(iv);};
}


/* ===== 교사용 · 지문 추가 (공유 저장소) ===== */
let DB=null,CAN_EDIT=false,editing=null,tmsg='',delArm=null,tdocs=[];
function parseVocab(t){
  const out=[],bad=[];
  t.split(/\n/).forEach((ln,i)=>{
    ln=ln.trim();if(!ln)return;
    const a=ln.split('=').map(x=>x.trim());
    if(a.length<2||!a[0]||!a[1]){bad.push(i+1);return;}
    const o={en:a[0],ko:a[1].split('|').map(x=>x.trim()).filter(Boolean).join('|')};
    if(a[2])o.form=a[2];
    if(!o.ko){bad.push(i+1);return;}
    out.push(o);
  });
  return {out:out,bad:bad};
}
function fromDoc(id,d){
  return {id:id,title:d.title||'(제목 없음)',source:d.source||'',text:d.text||'',order:d.order||0,
    trans:Array.isArray(d.trans)&&d.trans.length?d.trans:undefined,
    vocab:(d.vocab||[]).map(v=>v.form&&v.form!==v.en?[v.en,v.ko,v.form]:[v.en,v.ko])};
}
function applyDocs(snap){
  tdocs=snap.docs.map(x=>fromDoc(x.id,x.data()||{})).sort((a,b)=>a.order-b.order);
  PASSAGES.splice(0,PASSAGES.length);
  (tdocs.length?tdocs:BUILTIN).forEach(p=>PASSAGES.push(p));
  if(!P(sel))sel=PASSAGES[0].id;
  const home=!views.home.hidden,tch=!views.teacher.hidden,rec=!views.records.hidden;
  if(home)renderHome();else if(rec)renderRecords();else if(tch)renderTeacher();
}
function renderTeacher(){
  const root=$('#tch');root.textContent='';
  if(!DB||!CAN_EDIT){root.append(el('p','note','교사용 화면은 선생님 계정으로 열었을 때만 보여요.'));return;}
  const col=DB.collection('passages');
  const cur=editing?tdocs.find(x=>x.id===editing):null;
  const card=el('div','card');
  card.append(el('h2','dtitle',cur?'지문 수정':'새 지문 추가'));
  const f=el('div','tform');
  const mk=(lab,hint,tag,val,ph)=>{
    const l=el('label','',lab);const i=el(tag);if(tag==='input')i.type='text';
    i.value=val||'';if(ph)i.placeholder=ph;l.append(i);if(hint)l.append(el('span','hint',hint));f.append(l);return i;
  };
  const vtxt=cur?cur.vocab.map(v=>v[0]+' = '+v[1]+(v[2]?' = '+v[2]:'')).join('\n'):'';
  const iT=mk('제목','','input',cur&&cur.title,'예) 2025년 3월 고1 23번');
  const iS=mk('출처','','input',cur&&cur.source,'예) 2025학년도 3월 학력평가');
  const iX=mk('영어 본문','본문을 그대로 붙여 넣어요. 문장은 . ? ! 로 나눠요.','textarea',cur&&cur.text);
  const iR=mk('문장별 우리말 해석 (선택, 권장)','영어 문장 순서대로 한 줄에 한 문장씩. Sentence Runner 화면 위에 보여요.','textarea',cur&&(cur.trans||[]).join('\n'));
  const iV=mk('어휘','한 줄에 하나: 영어 = 뜻1|뜻2   (본문에서 모양이 바뀌면: 영어 = 뜻 = 본문 속 형태)\n예) discover = 발견하다|알아내다 = discovered','textarea',vtxt);
  iV.style.minHeight='160px';
  const chk=el('div','tchk');f.append(chk);
  const upd=()=>{
    const ns=iX.value.trim()?sentencesOf({text:iX.value}).length:0;
    const nt=iR.value.split('\n').filter(x=>x.trim()).length;
    const pv=parseVocab(iV.value);
    let m='문장 '+ns+'개 · 해석 '+nt+'줄 · 어휘 '+pv.out.length+'개';
    let warn=false;
    if(nt&&nt!==ns){m+='  ⚠ 해석 줄 수가 문장 수와 달라요';warn=true;}
    if(pv.bad.length){m+='  ⚠ 어휘 '+pv.bad.join(', ')+'번째 줄 형식을 확인해 주세요';warn=true;}
    chk.textContent=m;chk.classList.toggle('warn',warn);
  };
  [iX,iR,iV].forEach(i=>i.addEventListener('input',upd));upd();
  const msg=el('div','tmsg',tmsg);tmsg='';
  const row=el('div','btnrow');row.style.justifyContent='flex-start';
  const save=el('button','btn',cur?'수정 저장':'저장');save.type='button';
  save.onclick=async()=>{
    const pv=parseVocab(iV.value);
    if(!iT.value.trim()||!iX.value.trim()){msg.textContent='제목과 영어 본문은 꼭 필요해요.';msg.style.color='var(--pen)';return;}
    if(pv.bad.length){msg.textContent='어휘 형식을 확인해 주세요.';msg.style.color='var(--pen)';return;}
    save.disabled=true;
    const body={title:iT.value.trim(),source:iS.value.trim(),text:iX.value.trim(),
      trans:iR.value.split('\n').map(x=>x.trim()).filter(Boolean),vocab:pv.out,
      order:cur?cur.order:Date.now()};
    try{
      const id=cur?cur.id:'p'+Date.now().toString(36);
      await col.doc(id).set(body);
      editing=null;tmsg=(cur?'수정했어요: ':'저장했어요: ')+body.title;renderTeacher();
    }catch(e){save.disabled=false;msg.textContent='저장하지 못했어요 ('+((e&&e.code)||'오류')+'). 잠시 후 다시 해보세요.';msg.style.color='var(--pen)';}
  };
  row.append(save);
  if(cur){const c=el('button','btn ghost','수정 취소');c.type='button';c.onclick=()=>{editing=null;renderTeacher();};row.append(c);}
  f.append(row,msg);card.append(f);root.append(card);
  const list=el('div','tlist');
  list.append(el('h3','rh','등록된 지문 '+tdocs.length+'개'));
  if(!tdocs.length)list.append(el('p','note','아직 직접 등록한 지문이 없어요. 지금은 예시 지문이 보이고, 첫 지문을 저장하면 예시는 사라져요.'));
  tdocs.forEach((p,i)=>{
    const r=el('div','trow');
    r.append(el('b','',p.title+' · 어휘 '+p.vocab.length+'개'));
    const bt=(txt,fn,dis)=>{const b=el('button','btn ghost sm',txt);b.type='button';b.disabled=!!dis;b.onclick=fn;r.append(b);return b;};
    const swap=async j=>{const a=tdocs[i],b=tdocs[j];try{await col.doc(a.id).update({order:b.order});await col.doc(b.id).update({order:a.order});}catch(e){}};
    bt('↑',()=>swap(i-1),i===0);bt('↓',()=>swap(i+1),i===tdocs.length-1);
    bt('수정',()=>{editing=p.id;renderTeacher();window.scrollTo(0,0);});
    const d=bt(delArm===p.id?'정말 삭제':'삭제',async()=>{
      if(delArm!==p.id){delArm=p.id;renderTeacher();return;}
      delArm=null;try{await col.doc(p.id).delete();}catch(e){}renderTeacher();
    });
    if(delArm===p.id)d.style.borderColor='var(--pen)';
    list.append(r);
  });
  root.append(list);
}
async function initShared(){
  try{
    if(!(window.claude&&window.claude.use))return;
    const user=await window.claude.use('user');
    CAN_EDIT=!!(user&&user.canEdit());
    const db=await window.claude.use('db');
    if(!db)return;
    DB=db;
    $('#tbtn').hidden=!CAN_EDIT;
    db.collection('passages').onSnapshot(applyDocs,function(){});
  }catch(e){}
}


/* ===== 구글 시트에서 지문 불러오기 (배포용) ===== */
let loadState='idle';
const CKEY='jimun-hanbakwi.passages.v1';
function convertSheet(it){
  const id=String(it.id||'').trim(),text=String(it.text||'').trim();
  if(!id||!text)return null;
  const trans=String(it.trans||'').split('\n').map(x=>x.trim()).filter(Boolean);
  const pv=parseVocab(String(it.vocab||''));
  const chunks=String(it.chunks||'').split(/\s*\/\/\s*/).map(s=>s.split(/\s+\/\s+/).map(x=>x.trim()).filter(Boolean)).filter(a=>a.length);
  return {id:id,title:String(it.title||'(제목 없음)'),source:String(it.source||''),text:text,
    trans:trans.length?trans:undefined,chunks:chunks.length?chunks:undefined,
    vocab:pv.out.map(v=>v.form&&v.form!==v.en?[v.en,v.ko,v.form]:[v.en,v.ko])};
}
function setPassages(raw){
  const list=raw.map(convertSheet).filter(Boolean);
  PASSAGES.splice(0,PASSAGES.length);
  list.forEach(p=>PASSAGES.push(p));
  if(!P(sel))sel=PASSAGES[0]?PASSAGES[0].id:null;
}
function refreshView(){
  if(!views.home.hidden)renderHome();else if(!views.records.hidden)renderRecords();
}
async function initSheet(){
  try{
    const c=JSON.parse(localStorage.getItem(CKEY)||'null');
    if(Array.isArray(c)&&c.length)setPassages(c);
  }catch(e){}
  loadState=PASSAGES.length?'cached':'loading';
  refreshView();
  try{
    const r=await fetch(SHEET_URL);
    const j=await r.json();
    if(!j||!Array.isArray(j.passages))throw new Error('bad');
    setPassages(j.passages);
    try{localStorage.setItem(CKEY,JSON.stringify(j.passages));}catch(e){}
    loadState='ok';
  }catch(e){
    loadState=PASSAGES.length?'cached':'fail';
  }
  refreshView();
}

/* ===== 시작 ===== */
$('#back').onclick=()=>show('home');
$$('.nav button').forEach(b=>{b.onclick=()=>show(b.dataset.v);});
renderBadge();
show('home');
if(SHEET_URL)initSheet();else initShared();
})();
</script>
